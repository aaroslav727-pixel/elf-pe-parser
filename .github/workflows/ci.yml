name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Build samples and verify checksec verdicts
        run: CC=gcc samples/build.sh && samples/check.sh build/binsec

      - name: Example output (/bin/ls)
        run: ./build/binsec /bin/ls && ./build/binsec /bin/ls --json

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - name: Build static CLI + GUI
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: binsec-windows-x64
          path: |
            build/binsec.exe
            build/binsec-gui.exe

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          clang++ --version
          sudo apt-get install -y --no-install-recommends "libclang-rt-$(clang++ -dumpversion | cut -d. -f1)-dev" || true

      - name: Build libFuzzer target (ASan + UBSan)
        run: |
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DBINSEC_BUILD_FUZZER=ON -DBINSEC_BUILD_TESTS=OFF
          cmake --build build-fuzz --target binsec_fuzz -j

      - name: Extend corpus with freshly built samples
        run: CC=gcc samples/build.sh && python3 fuzz/gen_corpus.py -o fuzz/corpus samples/bin/*

      - name: Fuzz smoke run (60 s)
        run: |
          mkdir -p fuzz/artifacts
          ./build-fuzz/binsec_fuzz fuzz/corpus -max_total_time=60 -artifact_prefix=fuzz/artifacts/ -print_final_stats=1

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
